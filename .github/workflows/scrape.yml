name: Scrape RSS Feeds

on:
  schedule:
    - cron: "0 * * * *"   # every 15 minutes
  workflow_dispatch:           # allow manual trigger from GitHub UI

# Allow writing to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run scrapers
        run: npm run scrape

      - name: Commit and push updated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/ index.html
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "chore: update feeds $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
